server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # 1. Маршруты для получения Swagger спецификаций (api-docs)
        - id: hotel-swagger
          uri: lb://HOTEL-SERVICE
          predicates:
            - Path=/api/hotels/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: booking-swagger
          uri: lb://BOOKING-SERVICE
          predicates:
            - Path=/api/bookings/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        # 2. Основные маршруты
        - id: booking-service
          uri: lb://BOOKING-SERVICE
          predicates:
            - Path=/api/bookings/**,/api/booking/**,/api/user/**
          filters:
            - StripPrefix=1

        - id: hotel-service
          uri: lb://HOTEL-SERVICE
          predicates:
            - Path=/api/hotels/**,/api/rooms/**
          # Здесь БЕЗ StripPrefix

# ВАЖНО: springdoc находится на корневом уровне, а не внутри spring!
springdoc:
  swagger-ui:
    urls:
      - name: Booking Service
        url: /api/bookings/v3/api-docs
      - name: Hotel Service
        url: /api/hotels/v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: my-super-secret-key-for-mephi-spring-project-12345