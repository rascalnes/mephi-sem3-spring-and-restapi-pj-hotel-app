server:
  port: 8082

spring:
  profiles:
    active: demo
  application:
    name: hotel-service
  datasource:
    url: jdbc:h2:mem:hoteldb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Временный секрет (в этапе 7 вынесем в common)
          jwk-set-uri: http://localhost:8081/.well-known/jwks.json # Заглушка, реальная проверка будет через общий секрет
          # Мы будем использовать симметричный ключ (HMAC), поэтому используем secret-key
          # Для Spring Security OAuth2 Resource Server проще использовать публичный ключ,
          # но для учебного проекта сгенерируем RSA или используем Nimbus.

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html